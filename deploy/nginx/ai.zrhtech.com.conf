# Ubuntu system nginx — ZRH AI Enterprise (ai.zrhtech.com)
# Install (requires sudo for reload):
#   cp deploy/nginx/ai.zrhtech.com.conf /etc/nginx/sites-available/ai.zrhtech.com
#   ln -sfn /etc/nginx/sites-available/ai.zrhtech.com /etc/nginx/sites-enabled/ai.zrhtech.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Upstream containers (production compose):
#   web  -> 127.0.0.1:3010
#   api  -> 127.0.0.1:4010
#
# TLS: terminate at Cloudflare (Full Strict) or enable local 443 with Let's Encrypt.

# Rate limit zone is defined in http context — see deploy/nginx/ai-rate-limit.conf
# limit_req_zone $binary_remote_addr zone=zrh_ai_limit:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name ai.zrhtech.com;

    client_max_body_size 100m;

    # Security headers (also set at Cloudflare when possible)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Health for origin probes
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API — SSE / streaming / WebSocket friendly
    location /api/ {
        # limit_req zone=zrh_ai_limit burst=40 nodelay;

        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE / streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Frontend SPA + static
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
