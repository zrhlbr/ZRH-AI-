# ZRH AI - Docker Compose
# 所有资源统一 zrh-ai- 前缀，独立网络/数据卷，不触碰任何现有 ZRH 容器。
name: zrh-ai

services:
  zrh-ai-postgres:
    image: postgres:16-alpine
    container_name: zrh-ai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zrh_ai}
      POSTGRES_USER: ${POSTGRES_USER:-zrh_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - zrh-ai-postgres-data:/var/lib/postgresql/data
    networks:
      - zrh-ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  zrh-ai-redis:
    image: redis:7-alpine
    container_name: zrh-ai-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - zrh-ai-redis-data:/data
    networks:
      - zrh-ai-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  zrh-ai-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: zrh-ai-api:0.1.0
    container_name: zrh-ai-api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      BACKEND_PORT: 4010
      # 容器内通过服务名 + 内部端口访问数据库与缓存
      POSTGRES_HOST: zrh-ai-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-zrh_ai}
      POSTGRES_USER: ${POSTGRES_USER:-zrh_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: zrh-ai-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Docker 容器访问 Windows 宿主机 Ollama
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3010}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 只读挂载 Docker socket，供 /api/v1/system/docker 真实探活（不修改任何容器）
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${BACKEND_PORT:-4010}:4010"
    networks:
      - zrh-ai-network
    depends_on:
      zrh-ai-postgres:
        condition: service_healthy
      zrh-ai-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4010/api/v1/health | grep -q zrh-ai-api || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  zrh-ai-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: zrh-ai-web:0.1.0
    container_name: zrh-ai-web
    ports:
      - "${FRONTEND_PORT:-3010}:80"
    networks:
      - zrh-ai-network
    depends_on:
      zrh-ai-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -qi html || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  zrh-ai-network:
    name: zrh-ai-network
    driver: bridge

volumes:
  zrh-ai-postgres-data:
    name: zrh-ai-postgres-data
  zrh-ai-redis-data:
    name: zrh-ai-redis-data
