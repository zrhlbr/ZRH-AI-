# ZRH AI Enterprise — Production Compose (Blue-Green capable)
# Usage on server:
#   cd /home/zrh-admin/zrh-ai
#   docker compose -f docker-compose.production.yml --env-file .env up -d --build
#
# Blue-Green notes:
#   - Keep prior image tags (e.g. zrh-ai-api:1.1.0 / zrh-ai-web:1.1.0) for rollback
#   - Set ZRH_AI_IMAGE_TAG=1.2.0 for green; rollback by restoring tag + prior tree backup
#   - Host nginx unchanged: / -> :3010, /api -> :4010
#   - Do NOT delete V1.1 rollback images/backups without 赵总确认

name: zrh-ai

services:
  zrh-ai-postgres:
    image: postgres:16-alpine
    container_name: zrh-ai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zrh_ai}
      POSTGRES_USER: ${POSTGRES_USER:-zrh_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: Asia/Shanghai
    expose:
      - "5432"
    volumes:
      - zrh-ai-postgres-data:/var/lib/postgresql/data
    networks:
      - zrh-ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  zrh-ai-redis:
    image: redis:7-alpine
    container_name: zrh-ai-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - zrh-ai-redis-data:/data
    networks:
      - zrh-ai-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  zrh-ai-dev-runner:
    build:
      context: ./dev-runner
      dockerfile: Dockerfile
    image: zrh-ai-dev-runner:${ZRH_AI_IMAGE_TAG:-1.2.0}
    container_name: zrh-ai-dev-runner
    environment:
      RUNNER_PORT: 5055
      RUNNER_BIND: 0.0.0.0
      WORKSPACES_ROOT: /zrh-workspaces
      DEV_RUNNER_TOKEN: ${DEV_RUNNER_TOKEN:?DEV_RUNNER_TOKEN is required}
    volumes:
      - zrh-ai-workspaces:/zrh-workspaces
    expose:
      - "5055"
    networks:
      - zrh-ai-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5055/health | grep -q zrh-ai-dev-runner || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  zrh-ai-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: zrh-ai-api:${ZRH_AI_IMAGE_TAG:-1.2.0}
    container_name: zrh-ai-api
    environment:
      NODE_ENV: production
      BACKEND_PORT: 4010
      POSTGRES_HOST: zrh-ai-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-zrh_ai}
      POSTGRES_USER: ${POSTGRES_USER:-zrh_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: zrh-ai-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      WEB_ORIGIN: ${WEB_ORIGIN:-https://ai.zrhtech.com}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      CHAT_RAG_ENABLED: ${CHAT_RAG_ENABLED:-true}
      CHAT_RAG_MIN_SCORE: ${CHAT_RAG_MIN_SCORE:-0.28}
      KNOWLEDGE_STORAGE_PATH: /app/storage/documents
      DEV_RUNNER_URL: http://zrh-ai-dev-runner:5055
      DEV_RUNNER_TOKEN: ${DEV_RUNNER_TOKEN:?DEV_RUNNER_TOKEN is required}
      DEV_WORKSPACES_ROOT: /zrh-workspaces
      CURSOR_CLOUD_ENABLED: ${CURSOR_CLOUD_ENABLED:-false}
      MAIL_CONFIG_CRYPTO_KEY: ${MAIL_CONFIG_CRYPTO_KEY:?MAIL_CONFIG_CRYPTO_KEY is required}
      MAIL_DEV_CODE_ENABLED: ${MAIL_DEV_CODE_ENABLED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - zrh-ai-storage:/app/storage
      - zrh-ai-workspaces:/zrh-workspaces
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4010}:4010"
    networks:
      - zrh-ai-network
    depends_on:
      zrh-ai-postgres:
        condition: service_healthy
      zrh-ai-redis:
        condition: service_healthy
      zrh-ai-dev-runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4010/api/v1/health | grep -q zrh-ai-api || exit 1"]
      interval: 30s
      timeout: 25s
      retries: 6
      start_period: 90s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  zrh-ai-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: zrh-ai-web:${ZRH_AI_IMAGE_TAG:-1.2.0}
    container_name: zrh-ai-web
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3010}:80"
    networks:
      - zrh-ai-network
    depends_on:
      zrh-ai-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -qi html || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  zrh-ai-network:
    name: zrh-ai-network
    driver: bridge

volumes:
  zrh-ai-postgres-data:
    name: zrh-ai-postgres-data
  zrh-ai-redis-data:
    name: zrh-ai-redis-data
  zrh-ai-storage:
    name: zrh-ai-storage
  zrh-ai-workspaces:
    name: zrh-ai-workspaces
